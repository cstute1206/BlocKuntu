<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blocked by BlocKuntu</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        align-items: center;
        background: Canvas;
        color: CanvasText;
        display: grid;
        margin: 0;
        min-height: 100vh;
        padding: 32px;
      }

      main {
        max-width: 720px;
        width: min(100%, 720px);
      }

      h1 {
        font-size: clamp(2.25rem, 7vw, 4.5rem);
        letter-spacing: 0;
        line-height: 1;
        margin: 0 0 20px;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.55;
        margin: 0 0 12px;
      }

      .status {
        color: color-mix(in srgb, CanvasText 74%, Canvas 26%);
        font-size: 0.98rem;
        margin-bottom: 0;
      }

      dl {
        display: grid;
        gap: 10px 16px;
        grid-template-columns: max-content minmax(0, 1fr);
        margin: 28px 0 0;
      }

      dt {
        color: color-mix(in srgb, CanvasText 70%, Canvas 30%);
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      code {
        font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.95em;
      }

      .value {
        font-weight: 650;
      }

      .muted {
        color: color-mix(in srgb, CanvasText 70%, Canvas 30%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Blocked by BlocKuntu</h1>
      <p id="summary">This navigation was blocked by the local policy.</p>
      <p class="status" id="detail"></p>
      <dl id="details">
        <dt>URL</dt>
        <dd><code id="blocked-url">unknown</code></dd>
        <dt>Reason</dt>
        <dd><span class="value" id="blocked-reason">blocked</span></dd>
      </dl>
    </main>
    <script src="dist/blocked.js"></script>
  </body>
</html>
