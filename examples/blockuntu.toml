[strict_mode]
require_firefox_extension = true
require_chrome_extension = true
kill_supported_browser_if_extension_stale = true
block_unsupported_browsers = true
grace_seconds = 30

[[allowances]]
id = "social-daily"
name = "Social daily allowance"
daily_minutes = 30

[[schedules]]
id = "work-hours"
name = "Work hours"

[[schedules.windows]]
weekday = "mon"
start = "09:00"
end = "17:00"

[[schedules.windows]]
weekday = "tue"
start = "09:00"
end = "17:00"

[[schedules.windows]]
weekday = "wed"
start = "09:00"
end = "17:00"

[[schedules.windows]]
weekday = "thu"
start = "09:00"
end = "17:00"

[[schedules.windows]]
weekday = "fri"
start = "09:00"
end = "17:00"

[[rules]]
id = "instagram-hard"
name = "Instagram hard block"
tier = "hard"
patterns = [
  { kind = "domain", value = "instagram.com", match_subdomains = true }
]

[[rules]]
id = "reddit-hard"
name = "Reddit hard block"
tier = "hard"
patterns = [
  { kind = "domain", value = "reddit.com", match_subdomains = true },
  { kind = "domain", value = "redd.it", match_subdomains = true }
]

[[rules]]
id = "twitch-hard"
name = "Twitch hard block"
tier = "hard"
patterns = [
  { kind = "domain", value = "twitch.tv", match_subdomains = true }
]

[[rules]]
id = "tiktok-hard"
name = "TikTok hard block"
tier = "hard"
patterns = [
  { kind = "domain", value = "tiktok.com", match_subdomains = true }
]

[[rules]]
id = "youtube-controlled"
name = "YouTube Tier 3 controlled access"
tier = "controlled_access"
schedule_ids = ["work-hours"]
allowance_id = "social-daily"
patterns = [
  { kind = "domain", value = "youtube.com", match_subdomains = true }
]

[[app_rules]]
id = "kmines-scheduled"
name = "KMines Tier 2 scheduled block"
tier = "scheduled_block"
schedule_ids = ["work-hours"]
matchers = [
  { kind = "command_name", value = "kmines" },
  { kind = "executable_basename", value = "kmines" },
  { kind = "desktop_id", value = "org.kde.kmines.desktop" },
  { kind = "window_title_contains", value = "KMines" }
]

[[app_rules]]
id = "vlc-hard"
name = "VLC hard block"
tier = "hard"
matchers = [
  { kind = "command_name", value = "vlc" },
  { kind = "executable_basename", value = "vlc" },
  { kind = "desktop_id", value = "org.videolan.VLC.desktop" },
  { kind = "desktop_id", value = "vlc.desktop" },
  { kind = "window_title_contains", value = "VLC" }
]
