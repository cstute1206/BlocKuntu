[package]
name = "blockuntu-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "blockuntu_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blockuntu-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
focus-core = { path = "../../focus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.2"
thiserror = "1"
rfd = "0.15"
