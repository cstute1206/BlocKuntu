[package]
name = "blockuntu-tauri"
version = "0.1.0"
description = "Tauri shell for focus-hosts"
authors = ["AstuteCouch"]
edition = "2021"

[lib]
name = "blockuntu_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tauri = { version = "2.11.2", features = [] }
url = "2.5"
